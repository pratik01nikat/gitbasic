name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for iPad simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project Folio.xcodeproj \
            -target Folio \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  screenshots:
    name: iPad simulator screenshots
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Folio.xcodeproj \
            -target Folio \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            -quiet \
            build

      - name: Capture screenshots
        run: .github/scripts/screenshots.sh build/Debug-iphonesimulator/Folio.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Commit screenshots to the branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "Update iPad simulator screenshots [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
